body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
nav{background:var(--rail);color:var(--rail-ink);padding:18px 12px;position:sticky;top:0;height:100vh}
nav .brand{font-weight:700;color:#fff;font-size:15px;letter-spacing:.02em;padding:6px 10px 14px}
nav .brand small{display:block;font-weight:400;color:var(--rail-ink);font-size:11px;margin-top:2px}

.tile{background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:12px 14px;box-shadow:var(--shadow)}
.tile .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:24px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
.tile .v.crit{color:var(--crit)} .tile .v.warn{color:#b07a00} .tile .d{font-size:11px;color:var(--muted);margin-top:2px}
.narr{background:var(--surface);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0;margin-top:14px;max-width:72ch;color:var(--ink-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px} .two>div{min-width:0}

table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--hair);border-radius:8px;overflow:hidden;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--hair);background:var(--surface-2);white-space:nowrap;cursor:pointer;user-select:none}
th.r,td.r{text-align:right} td{padding:7px 10px;border-bottom:1px solid var(--hair);vertical-align:middle}
tr:last-child td{border-bottom:0} tbody tr:hover td{background:var(--surface-2)}
tr.click{cursor:pointer} .wrap{overflow-x:auto}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600}
.pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.warn{background:var(--warn-bg);color:#8a5a00} .pill.ok{background:var(--surface-2);color:var(--ink-2)}
.pct.crit{color:var(--crit);font-weight:600} .pct.warn{color:#b07a00;font-weight:600} .pct.up{color:var(--good)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px}
.muted{color:var(--muted)} .small{font-size:12px}
.controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.controls label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block}
.controls input[type=range]{width:150px} .controls input[type=search],.controls select{font:inherit;padding:6px 8px;border:1px solid var(--hair);border-radius:6px;background:var(--surface);color:var(--ink);min-width:220px}
.controls .val{font-weight:600}
.back{background:none;border:1px solid var(--hair);color:var(--ink-2);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer;margin-bottom:10px}
.heat{display:inline-block;min-width:54px;text-align:right;padding:2px 6px;border-radius:4px}
.heat.lo{background:var(--heat-lo)} .heat.hi{background:var(--heat-hi)}

.legend{font-size:11px;color:var(--muted);margin-top:6px}
a{color:var(--accent)}

<script>
const D=JSON.parse(document.getElementById('data').textContent);

 return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--bar)" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${w}" cy="${(h-2-(Math.max(v[11],0)/mx)*(h-4)).toFixed(1)}" r="2.2" fill="var(--bar)"/></svg>`;}

 const y=x=>pt+(H_-pt-pb)*(1-x/mx);const y0=y(0);const ticks=[0,0.5,1].map(t=>t*mx);

 for(const t of ticks){const yy=y(t);s+=`<line x1="${pl}" x2="${W_-6}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="var(--hair)"/><text x="${pl-6}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtN(t)}</text>`;}
 v.forEach((x,i)=>{const cx=pl+i*iw+(iw-bw)/2;const yy=y(Math.max(x,0));const hh=Math.abs(y0-y(x));
  s+=`<rect x="${cx.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(hh,0.5).toFixed(1)}" rx="3" fill="${i===11?'var(--bar)':'var(--bar-dim)'}" data-tip="${lab[i]}: ${fmtN(x)} ${unit||''}"/>`;
  s+=`<text x="${(cx+bw/2).toFixed(1)}" y="${H_-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${lab[i]}</text>`;});

 <div class="controls"><div><label for="ae">AE</label><select id="ae"><option>(All)</option>${aes.map(a=>`<option ${a===custAE?'selected':''}>${a}</option>`).join('')}</select></div><div><label for="am">AM</label><select id="am"><option>(All)</option>${ams.map(a=>`<option ${a===custAM?'selected':''}>${a}</option>`).join('')}</select></div><div><label for="q">Search</label><input type="search" id="q" placeholder="customer name" value="${esc(custQ)}" autocomplete="off"></div>
 <div><label>Shown</label><div class="val" id="cshown"></div></div></div><div id="ctable"></div>`;

 ${list.map(c=>`<tr class="click" tabindex="0" data-c="${esc(c.name)}"><td>${esc(c.name)}${c.how==='not on list'?' <span class="pill ok" title="not on the customer list">no AE</span>':''}</td><td>${esc(c.ae)}</td><td>${esc(c.am)}</td><td class="r">${c.items}</td><td class="r">${c.act3}</td><td class="r">${c.aug}</td><td>${spark(c.n)}</td></tr>`).join('')}${list.length?'':'<tr><td colspan="7" class="muted">No customers match.</td></tr>'}</tbody></table></div>`;
 main.querySelectorAll('th[data-k]').forEach(t=>{const go=()=>{const k=t.dataset.k;custSort=custSort.k===k?{k,d:-custSort.d}:{k,d:k==='name'||k==='ae'||k==='am'?1:-1};custTable();};t.onclick=go;t.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});}
function card(name){const c=C[name];if(!c)return;const rows=[...c.rows].sort((a,b)=>b.qttm-a.qttm||b.last-a.last);
 main.innerHTML=`<button class="back" id="back">← Back</button><h1>${esc(c.name)}</h1><div class="sub">AE ${esc(c.ae)||'—'} · AM ${esc(c.am)||'—'} · ${c.items} items · ${esc(D.asof)}</div>
 <div class="tiles">${tile('Items (TTM)',c.items,'invoiced in the last 12 months')}${tile('Active last 3 mo',c.act3,'items invoiced Jun–Aug-26')}${tile('Aug-26',c.aug,'items invoiced')}</div>

 <h2>Items — sorted by TTM quantity (click for the item card)</h2>
 <div class="narr howto"><b>How to read this table.</b> One row per product this customer buys. <b>Unit</b> = the unit we sell it in (ea = each, cs = case, lb = pound) — every quantity on the row is in that unit. <b>TTM qty</b> = total quantity invoiced in the last 12 months (Sep-25 through Aug-26). <b>Aug-26 qty</b> = quantity invoiced in August 2026. <b>3mo Trend vs TTM Avg</b> = the average month for June–August 2026 compared with the average month over the last 12: 100% means the same pace, 50% means half; orange is under 70%, red is under 50%. <b>On hand</b> = quantity in our warehouses right now (not counting stock in transit). <b>OTW</b> = on the way: in transit to us plus ordered from the supplier but not yet shipped. On hand and OTW are for the product as a whole, so if another customer buys the same product they see the same numbers. <b>12 mo</b> = quantity each month over the last 12 months.</div>
 <div class="wrap"><table><thead><tr><th>Item</th><th>Description</th><th>Unit</th><th class="r">TTM qty</th><th class="r">Aug-26 qty</th><th class="r">3mo Trend vs TTM Avg</th><th class="r">On hand</th><th class="r">OTW</th><th>12 mo</th></tr></thead><tbody>

function grid(rowsIn,firstHdr){let h=`<div class="wrap"><table class="gridt"><thead><tr><th class="sticky">${firstHdr}</th><th class="r">TTM</th>${M.map(m=>`<th class="r">${m}</th>`).join('')}</tr></thead><tbody>`;

function itemTable(){const list=ITEMS_ALL.filter(x=>(itemCat==='All'||cat(x.p)===itemCat)&&(!itemQ||x.hay.includes(itemQ)));
 document.getElementById('ishown').textContent=`${list.length} items${list.length>400?' · first 400 shown — narrow the search':''}`;
 document.getElementById('itable').innerHTML=`<div class="wrap"><table><thead><tr><th>Item</th><th>Category</th><th>Description</th><th>Unit</th><th class="r">Customers</th><th class="r">TTM qty sold</th><th class="r">Aug-26 qty</th><th class="r">3mo Trend vs TTM Avg</th><th class="r">On hand</th><th class="r">In transit</th><th class="r">Open PO</th><th>12 mo</th></tr></thead><tbody>
 ${list.slice(0,400).map(x=>`<tr class="click" data-item="${x.p}" title="${esc(x.cust.join(', '))}"><td class="mono">${x.p}</td><td class="small">${cat(x.p)}</td><td class="small">${esc(x.it.d).slice(0,70)}</td><td class="small">${x.it.u}</td><td class="r">${x.n}</td><td class="r">${fmtQ(x.qttm)}</td><td class="r">${fmtQ(x.last)}</td><td class="r pct ${trendCls(x.trend)}">${pct(x.trend)}</td><td class="r">${fmtN(x.it.oh)}</td><td class="r">${fmtN(x.it.it)}</td><td class="r">${fmtN(x.it.po)}</td><td>${spark(x.q)}</td></tr>`).join('')}${list.length?'':'<tr><td colspan="12" class="muted">No items match.</td></tr>'}</tbody></table></div>`;}
function itemCard(p){const it=D.items[p];if(!it)return;const rs=D.rows.filter(r=>r.p===p&&r.any).sort((a,b)=>b.qttm-a.qttm||b.last-a.last);const q=new Array(N).fill(0);for(const r of rs)for(let i=0;i<N;i++)q[i]+=r.q[i];
 const qttm=sum(q,0,12),l3=sum(q,0,3)/3,tr=qttm>0?l3/(qttm/12):null;
 main.innerHTML=`<button class="back" id="back">← Back</button><h1><span class="mono">${p}</span> · ${esc(it.d)}</h1><div class="sub">${cat(p)} · sold in ${it.u} · ${rs.length} customer${rs.length===1?'':'s'} · ${esc(D.asof)}</div>
 <div class="tiles">${tile('TTM qty sold',fmtN(qttm),it.u)}${tile('Aug-26 qty',fmtN(q[0]),it.u)}${tile('3mo Trend vs TTM Avg',pct(tr),'Jun–Aug avg month vs last-12-month avg month',trendCls(tr))}${tile('On hand',fmtN(it.oh),it.u+' in our warehouses now')}${tile('In transit',fmtN(it.it),it.u+' shipped to us, not received')}${tile('Open PO',fmtN(it.po),it.u+' ordered, not yet shipped')}</div>
 <h2>Monthly quantity — last 12 months, all customers</h2>${bars(q,p+' — '+it.d,it.u)}
 <h2>Monthly quantity by customer — 18 months</h2>
 <div class="narr howto"><b>How to read this table.</b> One row per customer that buys this product. Quantity invoiced each month, newest month on the left (Aug-26) back to Mar-25 on the right, in the product's unit. <b>TTM</b> = the 12-month total (Sep-25 through Aug-26). A cell shaded red is a month that came in under half of that customer's average month for this product.</div>
 ${grid(rs.map(r=>({label:r.c,sub:(D.custs[r.c]||{}).ae?'AE '+(D.custs[r.c]||{}).ae:'',q:r.q,href:'#customer='+encodeURIComponent(r.c)})),'Customer')}`;
 document.getElementById('back').onclick=goBack;}
// ---- routing ----
let view='customers',lastView='customers';
const VIEWS={customers,items};
function show(v,push=true){if(!VIEWS[v])v='customers';stack.length=0;lastView=view;view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));VIEWS[v]();window.scrollTo(0,0);if(push)history.replaceState(null,'','#'+v);}
const stack=[];
function openCard(name,push=true){if(!C[name])return;if(push)stack.push(location.hash||'#customers');lastView=view;card(name);window.scrollTo(0,0);if(push)history.replaceState(null,'','#customer='+encodeURIComponent(name));}
function openItem(p,push=true){if(!D.items[p])return;if(push)stack.push(location.hash||'#customers');lastView=view;itemCard(p);window.scrollTo(0,0);if(push)history.replaceState(null,'','#item='+encodeURIComponent(p));}
function goBack(){const h=stack.pop();if(!h){show(lastView);return;}history.replaceState(null,'',h);applyHash(h,false);}
function applyHash(hash,push){const h=decodeURIComponent(hash.slice(1));if(h.startsWith('customer='))openCard(h.slice(9),push);else if(h.startsWith('item='))openItem(h.slice(5),push);else show(h||'customers',false);}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
function rowGo(tr){if(!tr)return;if(tr.dataset.c)openCard(tr.dataset.c);else if(tr.dataset.item)openItem(tr.dataset.item);else if(tr.dataset.href){const h=decodeURIComponent(tr.dataset.href.slice(1));if(h.startsWith('customer='))openCard(h.slice(9));else if(h.startsWith('item='))openItem(h.slice(5));}}
main.addEventListener('click',e=>{if(e.target.closest('th')||e.target.closest('button'))return;rowGo(e.target.closest('tr.click'));});
main.addEventListener('keydown',e=>{const tr=e.target.closest('tr.click');if(tr&&(e.key==='Enter'||e.key===' ')){e.preventDefault();rowGo(tr);}if(e.key==='Escape'&&document.getElementById('back'))goBack();});
window.addEventListener('hashchange',()=>applyHash(location.hash,false));
// generic header-click sort for every table without a dedicated sorter
function parseCell(t){t=t.trim();if(t===''||t==='–'||t==='—')return null;const neg=/^\(.*\)$/.test(t);let x=t.replace(/[(),%\s]/g,'').replace(/\/12$/,'');const n=parseFloat(x);if(isNaN(n)||!/^-?[\d.]+$/.test(x))return t.toLowerCase();return neg?-n:n;}
main.addEventListener('click',e=>{const th=e.target.closest('th');if(!th||th.dataset.k)return;const table=th.closest('table');if(!table||table.id==='ct')return;const idx=[...th.parentNode.children].indexOf(th);const tb=table.tBodies[0];if(!tb)return;
 const dir=th.dataset.dir==='asc'?'desc':'asc';[...table.tHead.querySelectorAll('th')].forEach(h=>{h.dataset.dir='';h.textContent=h.textContent.replace(/ [▲▼]$/,'');});th.dataset.dir=dir;th.textContent+=dir==='asc'?' ▲':' ▼';
 const rows=[...tb.rows].filter(r=>r.cells.length>1);const keyed=rows.map(r=>({r,k:parseCell(r.cells[idx]?.textContent||'')}));
 keyed.sort((a,b)=>{if(a.k===null)return 1;if(b.k===null)return -1;if(typeof a.k==='number'&&typeof b.k==='number')return (a.k-b.k)*(dir==='asc'?1:-1);return String(a.k).localeCompare(String(b.k))*(dir==='asc'?1:-1);});
 keyed.forEach(x=>tb.appendChild(x.r));});
const tip=document.getElementById('tip');main.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');if(t){tip.textContent=t.dataset.tip;tip.style.display='block';tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-28)+'px';}else tip.style.display='none';});
applyHash(location.hash,false);
</script>
